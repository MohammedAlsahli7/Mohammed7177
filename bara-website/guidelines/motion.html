<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Snappy, springy press" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.m{font:500 11px/1.3 var(--font-mono);color:var(--fg-3);letter-spacing:.02em}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;border:2px solid var(--graphite-900)}.row{display:flex;gap:12px}.row>*{flex:1}</style></head><body><div class="row"><div style="border:2px solid var(--graphite-900);border-radius:14px;padding:12px;background:var(--paper-0)"><b style="font:700 15px/1 var(--font-body)">--ease-out</b><div class="m" style="margin-top:6px">cubic-bezier(.2,.8,.2,1)<br>default</div></div><div style="border:2px solid var(--graphite-900);border-radius:14px;padding:12px;background:var(--paper-0)"><b style="font:700 15px/1 var(--font-body)">--ease-spring</b><div class="m" style="margin-top:6px">cubic-bezier(.34,1.56,.64,1)<br>lifts, toggles</div></div><div style="border:2px solid var(--graphite-900);border-radius:14px;padding:12px;background:var(--paper-0)"><b style="font:700 15px/1 var(--font-body)">--ease-in-out</b><div class="m" style="margin-top:6px">cubic-bezier(.65,0,.35,1)<br>page moves</div></div></div><div class="m" style="margin-top:12px">--dur-fast 110ms · --dur-base 180ms · --dur-slow 320ms. Press = translate(3px,3px) + shadow → 0.</div></body></html>
