<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.m{font:500 11px/1.3 var(--font-mono);color:var(--fg-3);letter-spacing:.02em}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;border:2px solid var(--graphite-900)}.row{display:flex;gap:12px}.row>*{flex:1}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--yolk-500)"></div><b style="font:700 14px/1 var(--font-body)">Yolk</b><span class="m">--yolk-500<br>#F2B705</span></div><div class="sw"><div class="chip" style="background:var(--graphite-900)"></div><b style="font:700 14px/1 var(--font-body)">Graphite</b><span class="m">--graphite-900<br>#16161A</span></div><div class="sw"><div class="chip" style="background:var(--paper-1)"></div><b style="font:700 14px/1 var(--font-body)">Paper</b><span class="m">--paper-1<br>#F5F0E4</span></div><div class="sw"><div class="chip" style="background:var(--paper-0)"></div><b style="font:700 14px/1 var(--font-body)">Paper 0</b><span class="m">--paper-0<br>#FCFAF4</span></div></div></body></html>
