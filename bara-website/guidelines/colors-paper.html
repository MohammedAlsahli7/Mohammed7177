<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.m{font:500 11px/1.3 var(--font-mono);color:var(--fg-3);letter-spacing:.02em}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;border:2px solid var(--graphite-900)}.row{display:flex;gap:12px}.row>*{flex:1}</style></head><body><div style="display:flex;border:2px solid var(--graphite-900);border-radius:14px;overflow:hidden"><div style="flex:1;height:84px;background:var(--paper-0);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--graphite-900)"><b style="font:700 13px/1 var(--font-body)">0</b><span style="font:500 10px/1.3 var(--font-mono);opacity:.8">#FCFAF4</span></div><div style="flex:1;height:84px;background:var(--paper-1);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--graphite-900)"><b style="font:700 13px/1 var(--font-body)">1</b><span style="font:500 10px/1.3 var(--font-mono);opacity:.8">#F5F0E4</span></div><div style="flex:1;height:84px;background:var(--paper-2);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--graphite-900)"><b style="font:700 13px/1 var(--font-body)">2</b><span style="font:500 10px/1.3 var(--font-mono);opacity:.8">#EAE3D2</span></div><div style="flex:1;height:84px;background:var(--paper-3);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--graphite-900)"><b style="font:700 13px/1 var(--font-body)">3</b><span style="font:500 10px/1.3 var(--font-mono);opacity:.8">#D9D0BA</span></div><div style="flex:1;height:84px;background:var(--paper-4);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;color:var(--graphite-900)"><b style="font:700 13px/1 var(--font-body)">4</b><span style="font:500 10px/1.3 var(--font-mono);opacity:.8">#BFB49A</span></div></div></body></html>
