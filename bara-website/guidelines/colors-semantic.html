<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Status colours + tints" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.m{font:500 11px/1.3 var(--font-mono);color:var(--fg-3);letter-spacing:.02em}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;border:2px solid var(--graphite-900)}.row{display:flex;gap:12px}.row>*{flex:1}</style></head><body><div class="row"><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;height:56px;border-radius:12px;overflow:hidden;border:2px solid var(--graphite-900)"><div style="flex:1;background:var(--success)"></div><div style="flex:1;background:var(--success-tint)"></div></div><b style="font:700 14px/1 var(--font-body)">Success</b><span class="m">--success #1F8A4C</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;height:56px;border-radius:12px;overflow:hidden;border:2px solid var(--graphite-900)"><div style="flex:1;background:var(--warning)"></div><div style="flex:1;background:var(--warning-tint)"></div></div><b style="font:700 14px/1 var(--font-body)">Warning</b><span class="m">--warning #D69E00</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;height:56px;border-radius:12px;overflow:hidden;border:2px solid var(--graphite-900)"><div style="flex:1;background:var(--danger)"></div><div style="flex:1;background:var(--danger-tint)"></div></div><b style="font:700 14px/1 var(--font-body)">Danger</b><span class="m">--danger #D42A2A</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;height:56px;border-radius:12px;overflow:hidden;border:2px solid var(--graphite-900)"><div style="flex:1;background:var(--info)"></div><div style="flex:1;background:var(--info-tint)"></div></div><b style="font:700 14px/1 var(--font-body)">Info</b><span class="m">--info #2F6BFF</span></div></div></body></html>
