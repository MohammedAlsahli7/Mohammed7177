<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px}.m{font:500 11px/1.3 var(--font-mono);color:var(--fg-3);letter-spacing:.02em}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:12px;border:2px solid var(--graphite-900)}.row{display:flex;gap:12px}.row>*{flex:1}</style></head><body><div class="row" style="gap:28px;padding:4px 8px 0 0"><div style="display:flex;flex-direction:column;gap:12px"><div style="height:80px;border-radius:14px;border:2px solid var(--graphite-900);background:var(--paper-0);box-shadow:var(--shadow-hard-xs)"></div><span class="m">--shadow-hard-xs<br>2px</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="height:80px;border-radius:14px;border:2px solid var(--graphite-900);background:var(--paper-0);box-shadow:var(--shadow-hard-sm)"></div><span class="m">--shadow-hard-sm<br>3px</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="height:80px;border-radius:14px;border:2px solid var(--graphite-900);background:var(--paper-0);box-shadow:var(--shadow-hard)"></div><span class="m">--shadow-hard<br>5px</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="height:80px;border-radius:14px;border:2px solid var(--graphite-900);background:var(--paper-0);box-shadow:var(--shadow-hard-lg)"></div><span class="m">--shadow-hard-lg<br>8px</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="height:80px;border-radius:14px;border:0;background:var(--paper-0);box-shadow:var(--shadow-float)"></div><span class="m">--shadow-float<br>soft</span></div></div></body></html>
