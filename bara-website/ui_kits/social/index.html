<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bara' — Social</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--paper-2)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Posts.jsx"></script>
<script type="text/babel">
function App(){
  const [p,setP]=React.useState(.64);
  React.useEffect(()=>{const t=setInterval(()=>setP(x=>x>=1?0:+(x+.01).toFixed(2)),120);return()=>clearInterval(t)},[]);
  return <div style={{maxWidth:1280,margin:'0 auto',padding:'32px 40px',display:'flex',gap:28,alignItems:'flex-start',flexWrap:'wrap'}}>
    <div style={{display:'grid',gridTemplateColumns:'repeat(2,auto)',gap:28}}>
      <PostFrame label="Feed 1:1 · Product drop" scale={.33}><PostProductDrop/></PostFrame>
      <PostFrame label="Feed 1:1 · Material file" scale={.33}><PostMaterial/></PostFrame>
      <PostFrame label="Feed 1:1 · Brand quote (AR first)" scale={.33}><PostQuote/></PostFrame>
    </div>
    <PostFrame label="Story 9:16 · Print of the week" w={1080} h={1920} scale={.355}><StoryTimelapse progress={p}/></PostFrame>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
